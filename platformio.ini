[env:cardputer-adv]
; Application version is shared with Debian in src/Data/AppVersion.h.
platform = espressif32
board = m5stack-stamps3
framework = arduino
board_build.partitions = partitions_8mb.csv

build_unflags =
    -std=gnu++11

build_flags =
    -Os
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17
    -DULTIMATE_REMOTE_IR_TX_PIN=44

build_src_filter =
    +<*>
    -<Platform/Linux/>

lib_deps =
    M5Cardputer=https://github.com/m5stack/M5Cardputer
    fastled/FastLED@^3.3.3
    arduino-irremote/IRremote
